<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Key findings from the Environmental Research study</title><desc id="desc">Residential greenness NDVI odds ratio 0.91 with 95 percent confidence interval 0.842 to 0.977. Ambient temperature odds ratio 1.44 with 95 percent confidence interval 1.290 to 1.625.</desc><rect width="800" height="420" fill="#ffffff"/><text x="400" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#173b4d">Key Findings</text><text x="275" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#66737a">Lower odds of PND</text><text x="635" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#66737a">Higher odds of PND</text><line x1="160" y1="320" x2="720" y2="320" stroke="#9baaa9" stroke-width="2"/><line x1="316" y1="112" x2="316" y2="320" stroke="#6c8579" stroke-width="2" stroke-dasharray="8 7"/><text x="316" y="344" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#66737a">OR = 1.0</text><text x="28" y="170" font-family="Georgia, serif" font-size="18" fill="#132631">Residential greenness (NDVI)</text><line x1="250" y1="165" x2="302" y2="165" stroke="#173b4d" stroke-width="5" stroke-linecap="round"/><line x1="250" y1="155" x2="250" y2="175" stroke="#173b4d" stroke-width="3"/><line x1="302" y1="155" x2="302" y2="175" stroke="#173b4d" stroke-width="3"/><circle cx="276" cy="165" r="8" fill="#173b4d"/><text x="720" y="171" text-anchor="end" font-family="Georgia, serif" font-size="17" fill="#132631">OR 0.91 (0.842–0.977)</text><text x="28" y="250" font-family="Georgia, serif" font-size="18" fill="#132631">Ambient temperature</text><line x1="497" y1="245" x2="653" y2="245" stroke="#2f6071" stroke-width="5" stroke-linecap="round"/><line x1="497" y1="235" x2="497" y2="255" stroke="#2f6071" stroke-width="3"/><line x1="653" y1="235" x2="653" y2="255" stroke="#2f6071" stroke-width="3"/><circle cx="567" cy="245" r="8" fill="#2f6071"/><text x="720" y="251" text-anchor="end" font-family="Georgia, serif" font-size="17" fill="#132631">OR 1.44 (1.290–1.625)</text><text x="400" y="392" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#66737a">Odds ratios and 95% confidence intervals from fully adjusted models.</text></svg>