<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Key findings from the Environmental Research study</title><desc id="desc">Residential greenness NDVI odds ratio 0.91 with 95 percent confidence interval 0.842 to 0.977. Ambient temperature odds ratio 1.44 with 95 percent confidence interval 1.290 to 1.625.</desc><rect width="800" height="440" fill="#ffffff"/><text x="400" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#173b4d">Key Findings</text><text x="310" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#66737a">Lower odds of PND</text><text x="565" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#66737a">Higher odds of PND</text><line x1="210" y1="332" x2="640" y2="332" stroke="#9baaa9" stroke-width="2"/><line x1="367" y1="112" x2="367" y2="332" stroke="#6c8579" stroke-width="2" stroke-dasharray="8 7"/><text x="367" y="356" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#66737a">OR = 1.0</text><text x="36" y="170" font-family="Georgia, serif" font-size="18" fill="#132631">Residential greenness (NDVI)</text><line x1="308" y1="165" x2="357" y2="165" stroke="#173b4d" stroke-width="5" stroke-linecap="round"/><line x1="308" y1="155" x2="308" y2="175" stroke="#173b4d" stroke-width="3"/><line x1="357" y1="155" x2="357" y2="175" stroke="#173b4d" stroke-width="3"/><circle cx="333" cy="165" r="8" fill="#173b4d"/><text x="530" y="160" font-family="Georgia, serif" font-size="17" fill="#132631">OR 0.91</text><text x="530" y="184" font-family="Georgia, serif" font-size="15" fill="#66737a">95% CI: 0.842-0.977</text><text x="36" y="250" font-family="Georgia, serif" font-size="18" fill="#132631">Ambient temperature</text><line x1="487" y1="245" x2="641" y2="245" stroke="#2f6071" stroke-width="5" stroke-linecap="round"/><line x1="487" y1="235" x2="487" y2="255" stroke="#2f6071" stroke-width="3"/><line x1="641" y1="235" x2="641" y2="255" stroke="#2f6071" stroke-width="3"/><circle cx="556" cy="245" r="8" fill="#2f6071"/><text x="530" y="276" font-family="Georgia, serif" font-size="17" fill="#132631">OR 1.44</text><text x="530" y="300" font-family="Georgia, serif" font-size="15" fill="#66737a">95% CI: 1.290-1.625</text><text x="400" y="402" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#66737a">Odds ratios and 95% confidence intervals from fully adjusted models.</text></svg>