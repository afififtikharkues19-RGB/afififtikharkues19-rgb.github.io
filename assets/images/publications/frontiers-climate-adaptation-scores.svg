<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Community-Led Climate Adaptation</title><desc id="desc">Overall effectiveness scores for five community-led adaptation and mitigation strategies. Early warning systems 4 out of 5, social forestry 4 out of 5, embankment construction 3 out of 5, salt-tolerant crop cultivation 3 out of 5, and rainwater harvesting 3 out of 5.</desc><rect width="900" height="520" fill="#ffffff"/><text x="450" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#173b4d">Community-Led Climate Adaptation</text><text x="450" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#66737a">Overall effectiveness score (1-5)</text><line x1="320" y1="420" x2="720" y2="420" stroke="#9baaa9" stroke-width="2"/><g font-family="Georgia, serif" font-size="14" fill="#66737a" text-anchor="middle"><text x="400" y="445">1</text><text x="480" y="445">2</text><text x="560" y="445">3</text><text x="640" y="445">4</text><text x="720" y="445">5</text></g><g stroke="#d7ddd9" stroke-width="1"><line x1="400" y1="104" x2="400" y2="420"/><line x1="480" y1="104" x2="480" y2="420"/><line x1="560" y1="104" x2="560" y2="420"/><line x1="640" y1="104" x2="640" y2="420"/><line x1="720" y1="104" x2="720" y2="420"/></g><g font-family="Georgia, serif" font-size="18" fill="#132631"><text x="36" y="145">Early warning systems</text><text x="36" y="205">Social forestry</text><text x="36" y="265">Embankment construction</text><text x="36" y="325">Salt-tolerant crop cultivation</text><text x="36" y="385">Rainwater harvesting</text></g><g fill="#173b4d"><rect x="320" y="127" width="320" height="24" rx="3"/><rect x="320" y="187" width="320" height="24" rx="3"/></g><g fill="#6c8579"><rect x="320" y="247" width="240" height="24" rx="3"/><rect x="320" y="307" width="240" height="24" rx="3"/><rect x="320" y="367" width="240" height="24" rx="3"/></g><g font-family="Georgia, serif" font-size="17" font-weight="700" fill="#132631"><text x="770" y="145">4 / 5</text><text x="770" y="205">4 / 5</text><text x="770" y="265">3 / 5</text><text x="770" y="325">3 / 5</text><text x="770" y="385">3 / 5</text></g><text x="450" y="488" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#66737a">1 = Poor/Ineffective · 3 = Moderate/Effective · 5 = Excellent/Highly effective</text></svg>