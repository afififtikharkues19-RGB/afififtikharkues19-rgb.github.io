<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Key Ecological Risk Drivers</title><desc id="desc">Median potential ecological risk factor values for Sundarbans sediments: mercury 25.34, arsenic 13.12, lead 5.32, cobalt 4.75, copper 3.34, and nickel 3.25. Overall potential ecological risk index ranged from 49.97 to 74.03 and all sites were in the low aggregate ecological risk class.</desc><rect width="900" height="520" fill="#ffffff"/><text x="450" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#173b4d">Key Ecological Risk Drivers</text><text x="450" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#66737a">Median potential ecological risk factor (PERF)</text><g font-family="Georgia, serif" font-size="18" fill="#132631"><text x="48" y="135">Hg</text><text x="48" y="190">As</text><text x="48" y="245">Pb</text><text x="48" y="300">Co</text><text x="48" y="355">Cu</text><text x="48" y="410">Ni</text></g><g stroke="#d7ddd9" stroke-width="1"><line x1="160" y1="100" x2="160" y2="430"/><line x1="280" y1="100" x2="280" y2="430"/><line x1="400" y1="100" x2="400" y2="430"/><line x1="520" y1="100" x2="520" y2="430"/><line x1="640" y1="100" x2="640" y2="430"/></g><g fill="#173b4d"><rect x="160" y="117" width="480" height="24" rx="3"/><rect x="160" y="172" width="249" height="24" rx="3"/></g><g fill="#6c8579"><rect x="160" y="227" width="101" height="24" rx="3"/><rect x="160" y="282" width="90" height="24" rx="3"/><rect x="160" y="337" width="63" height="24" rx="3"/><rect x="160" y="392" width="62" height="24" rx="3"/></g><g font-family="Georgia, serif" font-size="17" font-weight="700" fill="#132631"><text x="710" y="135">25.34</text><text x="710" y="190">13.12</text><text x="710" y="245">5.32</text><text x="710" y="300">4.75</text><text x="710" y="355">3.34</text><text x="710" y="410">3.25</text></g><g font-family="Georgia, serif" font-size="13" fill="#66737a" text-anchor="middle"><text x="160" y="454">0</text><text x="280" y="454">~6</text><text x="400" y="454">~13</text><text x="520" y="454">~19</text><text x="640" y="454">~25</text></g><rect x="128" y="468" width="644" height="34" rx="4" fill="#eef2ef"/><text x="450" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#2f6071">Overall PERI: 49.97–74.03 · all sampled sites classified as low aggregate ecological risk</text></svg>