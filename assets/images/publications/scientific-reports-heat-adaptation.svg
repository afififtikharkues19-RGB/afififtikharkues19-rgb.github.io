<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Occupational Heat Adaptation</title><desc id="desc">Construction workers compared with welding workers. Taking regular breaks odds ratio 9.49, 95 percent confidence interval 2.45 to 36.74. Wearing loose clothing odds ratio 4.26, confidence interval 1.14 to 15.90. Using electric fans odds ratio 2.84, confidence interval 1.12 to 7.22.</desc><rect width="900" height="520" fill="#ffffff"/><text x="450" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#173b4d">Occupational Heat Adaptation</text><text x="450" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#66737a">Construction workers compared with welding workers</text><line x1="300" y1="112" x2="300" y2="404" stroke="#6c8579" stroke-width="2" stroke-dasharray="7 7"/><text x="300" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#66737a">OR = 1.0</text><text x="36" y="175" font-family="Georgia, serif" font-size="19" fill="#132631">Taking regular breaks</text><line x1="380" y1="170" x2="622" y2="170" stroke="#173b4d" stroke-width="5" stroke-linecap="round"/><line x1="380" y1="159" x2="380" y2="181" stroke="#173b4d" stroke-width="3"/><line x1="622" y1="159" x2="622" y2="181" stroke="#173b4d" stroke-width="3"/><circle cx="501" cy="170" r="8" fill="#173b4d"/><text x="690" y="163" font-family="Georgia, serif" font-size="17" fill="#132631">OR 9.49</text><text x="690" y="187" font-family="Georgia, serif" font-size="15" fill="#66737a">95% CI: 2.45-36.74</text><text x="36" y="265" font-family="Georgia, serif" font-size="19" fill="#132631">Wearing loose clothing</text><line x1="312" y1="260" x2="547" y2="260" stroke="#2f6071" stroke-width="5" stroke-linecap="round"/><line x1="312" y1="249" x2="312" y2="271" stroke="#2f6071" stroke-width="3"/><line x1="547" y1="249" x2="547" y2="271" stroke="#2f6071" stroke-width="3"/><circle cx="430" cy="260" r="8" fill="#2f6071"/><text x="690" y="253" font-family="Georgia, serif" font-size="17" fill="#132631">OR 4.26</text><text x="690" y="277" font-family="Georgia, serif" font-size="15" fill="#66737a">95% CI: 1.14-15.90</text><text x="36" y="355" font-family="Georgia, serif" font-size="19" fill="#132631">Using electric fans</text><line x1="310" y1="350" x2="477" y2="350" stroke="#6c8579" stroke-width="5" stroke-linecap="round"/><line x1="310" y1="339" x2="310" y2="361" stroke="#6c8579" stroke-width="3"/><line x1="477" y1="339" x2="477" y2="361" stroke="#6c8579" stroke-width="3"/><circle cx="393" cy="350" r="8" fill="#6c8579"/><text x="690" y="343" font-family="Georgia, serif" font-size="17" fill="#132631">OR 2.84</text><text x="690" y="367" font-family="Georgia, serif" font-size="15" fill="#66737a">95% CI: 1.12-7.22</text><text x="450" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#66737a">Odds ratios and 95% confidence intervals from multinomial logistic regression.</text></svg>